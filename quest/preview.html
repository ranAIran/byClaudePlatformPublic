<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latent Archipelago Preview</title>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.webgpu.min.js",
  "three/webgpu": "./vendor/three.webgpu.min.js",
  "three/tsl": "./vendor/three.webgpu.min.js"
} }
</script>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#a9d4f2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#20283a}
#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#fbf5e6;border:2px solid #20283a;border-radius:999px;padding:5px;box-shadow:0 3px 0 #20283a}
.bar button{font:600 14px system-ui,sans-serif;border:0;border-radius:999px;padding:8px 16px;background:transparent;cursor:pointer;color:#20283a}
.bar button[aria-pressed="true"]{background:#20283a;color:#fbf5e6}
.note{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(32,40,58,.8);color:#fbf5e6;padding:7px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar" role="group" aria-label="Style">
  <button type="button" data-style="old" aria-pressed="false">לפני</button>
  <button type="button" data-style="new" aria-pressed="true">אחרי</button>
</div>
<div class="note">תצוגה מקדימה בלבד · המשחק עצמו לא השתנה</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
