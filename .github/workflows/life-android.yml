name: Life Archipelago (tests + Android APK)

on:
  push:
    branches: [ "claude/life-archipelago" ]
    paths: [ "life/**", "quest/**", ".github/workflows/life-android.yml" ]
  workflow_dispatch:

permissions:
  contents: write   # publishes each APK as a GitHub pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (requirements R1–R3, R7, R8, sharing)
        working-directory: life
        run: |
          npm install --no-audit --no-fund
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle the shared web app into the APK
        run: bash life/android/copy-web.sh

      - name: Build APK
        working-directory: life/android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APKs
        run: |
          cp life/android/app/build/outputs/apk/life/debug/app-life-debug.apk life-archipelago.apk
          cp life/android/app/build/outputs/apk/quest/debug/app-quest-debug.apk latent-archipelago.apk

      - uses: actions/upload-artifact@v4
        with:
          name: archipelago-apks
          path: |
            life-archipelago.apk
            latent-archipelago.apk

      # Each build is its own pre-release, so it never replaces another app's "latest" release.
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: life-v0.1.${{ github.run_number }}
          name: "Life + Latent Archipelago 0.1.${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Two independent apps (under Assets): **life-archipelago.apk** and **latent-archipelago.apk** (the quest). Install either or both.
            Allow "install unknown apps" for your browser when asked. Each new build installs over the previous one.
            Built from ${{ github.sha }} on ${{ github.ref_name }}.
          files: |
            life-archipelago.apk
            latent-archipelago.apk
