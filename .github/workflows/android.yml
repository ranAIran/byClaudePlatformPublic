name: Android build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The Gradle download sometimes fails with a temporary 504; retry with back-off.
      - name: Download Gradle (with retries)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version --console=plain && exit 0
            echo "Gradle download failed (attempt $i), retrying in $((i * 30))s"; sleep $((i * 30))
          done
          exit 1

      - name: Unit tests (math engine, parser, Claude extractor)
        # Retries only help with temporary download errors (504); a real compile error fails all 3.
        run: |
          for i in 1 2 3; do
            ./gradlew :core:test --console=plain && exit 0
            echo "Attempt $i failed, retrying in $((i * 30))s"; sleep $((i * 30))
          done
          exit 1

      - name: Build APK
        # Retries only help with temporary download errors (504); a real compile error fails all 3.
        run: |
          for i in 1 2 3; do
            ./gradlew :app:assembleDebug --console=plain && exit 0
            echo "Attempt $i failed, retrying in $((i * 30))s"; sleep $((i * 30))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: math6-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk math6.apk

      # Each build becomes a Release; the newest one is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/math6.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "מתמטיקה ו׳ – גרסה 1.0.${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            הורדה: math6.apk (למטה, תחת Assets). בטלפון יש לאשר "התקנה ממקורות לא ידועים".
            Built from ${{ github.sha }} on branch ${{ github.ref_name }}.
          files: math6.apk
