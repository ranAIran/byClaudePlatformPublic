<style>
/* Warm dusk glass over a golden-hour world. One accent (gold) for progress and primary actions;
   state colours are separate: red = overdue, amber = due soon, green = all clear. */
:root{
  --ink:#fff7ec; --muted:#cdbcb4; --faint:rgba(255,240,225,.46);
  --panel:linear-gradient(180deg,rgba(64,46,76,.80),rgba(36,25,50,.88)); --panel-solid:#2c1f3a;
  --well:rgba(255,236,214,.075); --well-2:rgba(255,236,214,.14); --line:rgba(255,232,210,.16);
  --gold:#ffc94d; --gold-2:#ff9f1c; --gold-ink:#2a1a00; --gold-edge:#c27a00;
  --hp:#5fe09a; --bad:#ff7a6b; --soon:#ffc94d; --ok:#5fe09a;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --maxw:560px; --side:max(10px,calc((100% - var(--maxw)) / 2));
  color-scheme:dark;
}
/* Default colours: dark and high contrast. Near-opaque panels, white text, stronger lines and
   brighter state colours, so text stays readable over the bright city. "Faded" (menu) keeps the
   original warm glass above. */
html:not([data-theme="faded"]){
  --ink:#ffffff; --muted:#ddd6ea; --faint:rgba(255,255,255,.66);
  --panel:linear-gradient(180deg,rgba(24,20,38,.95),rgba(13,11,24,.97)); --panel-solid:#120f1f;
  --well:rgba(255,255,255,.08); --well-2:rgba(255,255,255,.16); --line:rgba(255,255,255,.26);
  --gold:#ffcc3d; --gold-2:#ff9a10; --gold-edge:#b86e00;
  --hp:#3ee88a; --bad:#ff5c4d; --soon:#ffcc3d; --ok:#3ee88a;
}
html:not([data-theme="faded"]) body{background:#120f1f}
html:not([data-theme="faded"]) .panel{box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
html:not([data-theme="faded"]) .lbl b{text-shadow:0 1px 0 #000,0 2px 10px rgba(0,0,0,.85),0 0 3px #000}
html:not([data-theme="faded"]) .lbl .badge{box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4)}
html:not([data-theme="faded"]) #scrim{background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.6))}
html:not([data-theme="faded"]) .gcard,html:not([data-theme="faded"]) .gplan,html:not([data-theme="faded"]) .gst{background:rgba(255,255,255,.07)}
html:not([data-theme="faded"]) .gimg,html:not([data-theme="faded"]) .gsimg{border-color:rgba(255,255,255,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2c1f3a;font-family:var(--font);color:var(--ink)}
/* Tabular digits only where numbers change in place: on the whole page it reversed Hebrew words in some fonts. */
#lvl,#xpTxt,#coinTxt,.stat span,.gdue{font-variant-numeric:tabular-nums}
#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fade{position:fixed;inset:0;background:#241733;opacity:0;pointer-events:none;transition:opacity .18s}
#scrim{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:linear-gradient(180deg,rgba(30,16,40,0) 30%,rgba(30,16,40,.5))}
body.sheet-open #scrim{opacity:1}
#labels{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);box-shadow:0 12px 32px rgba(28,10,34,.34),inset 0 1px 0 rgba(255,255,255,.09)}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}
.icon{width:20px;height:20px;display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--well);transition:transform .08s}
.btn.primary{background:linear-gradient(180deg,#ffd76a,#ffab2e);color:var(--gold-ink);border-color:#ffe39a;box-shadow:0 4px 0 var(--gold-edge)}
.btn:active{transform:translateY(2px)} .btn.primary:active{box-shadow:0 2px 0 var(--gold-edge)}
.bar{height:7px;border-radius:99px;background:rgba(255,236,214,.14);overflow:hidden;flex:1;min-width:24px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;background:var(--well);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;transition:transform .08s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:#ffe39a}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;box-shadow:0 6px 16px rgba(28,10,34,.22)}
.pill:active{transform:scale(.97)}
.pill .due{color:var(--soon);font-weight:700} .pill .due.late{color:var(--bad)}

/* HUD */
#hud{position:fixed;left:var(--side);right:var(--side);top:calc(10px + var(--top));display:grid;gap:8px;z-index:3}
#hudMain{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 9px;min-width:0}
/* Narrow phones: tighter top bar so all three buttons always fit on screen. */
@media (max-width:430px){#hudMain{gap:7px;padding:7px 7px 7px 8px}.hudbtn{width:36px;height:36px}#lvl{width:40px;height:40px;font-size:17px}.hud-bars{gap:7px}.stat .bar{min-width:14px}}
#lvl{width:44px;height:44px;border-radius:15px;background:linear-gradient(160deg,#ffe08a,#ff9f1c);display:grid;place-items:center;color:var(--gold-ink);font-weight:800;font-size:19px;box-shadow:0 3px 0 var(--gold-edge),inset 0 1px 0 rgba(255,255,255,.6);flex:none}
.hud-mid{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
#lvlName{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#today{font-size:11px;color:var(--muted);white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hud-bars{display:flex;gap:10px;align-items:center;min-width:0}
.stat{display:flex;align-items:center;gap:5px;min-width:0;font-size:10.5px;font-weight:600;color:var(--muted)}
.stat svg{width:13px;height:13px;flex:none}
.stat.xp{flex:1.5} .stat.hp{flex:1} .stat.coin{flex:none;color:var(--gold);font-weight:700}
.hudbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--well);display:grid;place-items:center;flex:none;transition:transform .08s}
.hudbtn:active{transform:scale(.94);background:var(--well-2)}
#quests{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px 6px;margin-bottom:-6px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
#quests::-webkit-scrollbar{display:none}
[dir="rtl"] #quests{-webkit-mask-image:linear-gradient(270deg,#000 88%,transparent);mask-image:linear-gradient(270deg,#000 88%,transparent)}
[dir="rtl"] #back svg,[dir="rtl"] .edit svg{transform:scaleX(-1)}
[dir="rtl"] #bagCount{right:auto;left:-6px}
[dir="rtl"] .fld input[type=date],[dir="rtl"] .fld input[type=url]{direction:ltr;text-align:right}
#quests .pill{flex:none;max-width:72vw;overflow:hidden;text-overflow:ellipsis}
#back{justify-self:start;font-size:13px;padding:8px 14px 8px 9px}
@media (max-width:379px){#today{display:none}}

/* district and room labels */
.lbl{position:absolute;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:3px;white-space:nowrap;pointer-events:auto;background:none;border:0;padding:4px;transition:transform .1s}
.lbl:active{transform:translate(-50%,-100%) scale(.95)}
.lbl b{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;text-shadow:0 1px 0 rgba(40,18,48,.9),0 2px 10px rgba(40,18,48,.75),0 0 2px rgba(40,18,48,.9)}
.lbl b i{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;color:#2c1f3a;box-shadow:0 2px 0 rgba(40,18,48,.35);flex:none}
.lbl b i svg{width:14px;height:14px}
.lbl .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#2c1f3a;box-shadow:0 2px 8px rgba(40,18,48,.3)}
.lbl .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.lbl[data-state="overdue"] .badge{background:var(--bad);color:#3a0d08;animation:nudge 2.4s ease-in-out infinite}
.lbl[data-state="soon"] .badge{background:var(--soon)}
.lbl[data-state="clear"] .badge{background:var(--ok);color:#06351c}
@keyframes nudge{0%,86%,100%{transform:none}90%{transform:translateY(-2px) scale(1.06)}95%{transform:translateY(1px)}}
.rlbl{position:absolute;transform:translate(-50%,-50%);padding:5px 11px;border-radius:12px;background:rgba(255,250,242,.94);color:#2c1f3a;font-weight:700;font-size:12px;box-shadow:0 4px 14px rgba(40,18,48,.3);pointer-events:auto;border:0;transition:transform .1s}
.rlbl:active{transform:translate(-50%,-50%) scale(.95)}
.rlbl.on{background:linear-gradient(180deg,#ffd76a,#ffb93a);box-shadow:0 3px 0 var(--gold-edge),0 6px 16px rgba(40,18,48,.3)}

/* dock */
#dock{position:fixed;left:var(--side);right:var(--side);bottom:calc(10px + var(--bot));z-index:3}
#bagBtn{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:3px solid #ffe7b8;background:radial-gradient(circle at 50% 38%,#fff3d0 0,#ffd27a 38%,#f0a234 72%,#c97a12 100%);display:grid;place-items:center;box-shadow:0 6px 0 #9c5d0c,0 14px 30px rgba(255,170,40,.42),inset 0 -6px 12px rgba(150,80,10,.35),inset 0 4px 8px rgba(255,255,255,.55);z-index:2;padding:0;transition:transform .12s}
#bagBtn:active{transform:translateX(-50%) translateY(3px)}
#bagArt{filter:drop-shadow(0 3px 2px rgba(90,40,10,.45));margin-top:2px}
#bagBtn.has #bagArt{animation:bagWiggle 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bagWiggle{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-7deg)}90%{transform:rotate(6deg)}94%{transform:rotate(-3deg)}}
#bagBtn.has::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,214,120,.8);animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}70%,100%{transform:scale(1.22);opacity:0}}
#bagCount.old{box-shadow:0 0 0 3px rgba(255,122,107,.45)}
#bagCount{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-weight:800;font-size:11px;border-radius:99px;padding:2px 7px;border:2px solid #fff}
#capture{padding:38px 9px 9px;border-radius:24px}
#capForm{display:flex;align-items:center;gap:4px;background:var(--well);border:1px solid var(--line);border-radius:15px;padding:3px 3px 3px 13px;transition:border-color .15s,background .15s}
#capForm:focus-within{border-color:rgba(255,201,77,.7);background:var(--well-2)}
#capInput{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;padding:10px 0;outline:none}
#capInput::placeholder,.addrow input::placeholder,#searchInput::placeholder,#fbText::placeholder{color:var(--faint)}
.capbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);transition:background .15s}
.capbtn:active{background:var(--well-2)} .capbtn.live{background:var(--bad)}
#viewCtl{position:fixed;right:var(--side);bottom:calc(132px + var(--bot));display:grid;gap:7px;z-index:3}
.hudbtn.float{width:42px;height:42px;border-radius:14px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 20px rgba(28,10,34,.3),inset 0 1px 0 rgba(255,255,255,.09)}
.hudbtn.float.on{background:linear-gradient(180deg,#ffd76a,#ffab2e);color:var(--gold-ink);border-color:#ffe39a}
#hint{max-width:calc(100vw - 130px);white-space:normal;text-align:center;line-height:1.35;position:fixed;left:50%;bottom:calc(238px + var(--bot));transform:translateX(-50%);pointer-events:none;font-size:12.5px;z-index:2;animation:hintIn .5s .8s both}
#hint.out{opacity:0;transition:opacity .4s}
@keyframes hintIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}}

/* sheets */
#sheet{position:fixed;left:var(--side);right:var(--side);bottom:calc(8px + var(--bot));max-height:72%;display:flex;flex-direction:column;border-radius:26px;padding:8px 14px 14px;z-index:5;animation:sheetIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{transform:translateY(28px);opacity:0}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--well-2);margin:0 auto 8px;flex:none}
#sheetHead{display:flex;align-items:center;gap:11px;margin-bottom:10px}
#sheetDot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#2c1f3a;flex:none;box-shadow:0 3px 0 rgba(40,18,48,.3),inset 0 1px 0 rgba(255,255,255,.5)}
#sheetDot svg{width:22px;height:22px}
#sheetHead h2{margin:0;font-size:19px;line-height:1.15}
#sheetSub{font-size:12px;margin-top:1px}
#sheetTabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;flex:none}
#sheetTabs::-webkit-scrollbar{display:none}
#sheetBody{overflow:auto;display:grid;gap:8px;padding-bottom:2px;scrollbar-width:thin}
.item{display:flex;align-items:flex-start;gap:11px;padding:11px 8px 11px 12px;border-radius:15px;background:var(--well);border:1px solid var(--line)}
button.item{align-items:center}
.item .main{flex:1;min-width:0;display:grid;gap:5px}
.item .main>.chip{justify-self:start}
.item .t{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;line-height:1.3}
.item.done{background:transparent}
.item.done .t{text-decoration:line-through;opacity:.5}
.item .meta{font-size:11.5px;color:var(--muted);line-height:1.45}
.check{width:27px;height:27px;border-radius:9px;border:2px solid var(--gold);background:transparent;flex:none;display:grid;place-items:center;color:var(--gold-ink);transition:background .15s,transform .08s;padding:0}
.check:active{transform:scale(.9)}
.check svg{width:17px;height:17px;stroke-dasharray:24;stroke-dashoffset:24}
.check.on{background:linear-gradient(180deg,#ffd76a,#ffb02e);border-color:#ffe39a}
.check.on svg{stroke-dashoffset:0}
.check.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.check.pop svg{animation:draw .35s .1s ease-out both}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.thumb{width:54px;height:54px;border-radius:11px;object-fit:cover;flex:none;border:1px solid var(--line)}
.steps{display:grid;gap:5px;margin-top:3px}
.step{display:flex;align-items:center;gap:9px;font-size:13px;background:none;border:0;text-align:start;padding:2px 0}
.step i{width:17px;height:17px;border-radius:6px;border:2px solid var(--gold);display:inline-block;flex:none;transition:background .15s}
.step.on i{background:var(--gold)} .step.on span{text-decoration:line-through;opacity:.55}
.x{width:32px;height:32px;border-radius:11px;border:1px solid var(--line);background:var(--well);flex:none;display:grid;place-items:center;color:var(--muted);transition:transform .08s}
.x:active{transform:scale(.92)}
.x.ghost{border:0;background:none;color:var(--faint);width:28px;height:28px;font-size:12px}
.addrow{display:flex;gap:6px;margin-top:4px}
.addrow input{flex:1;min-width:0;background:var(--well);border:1px solid var(--line);border-radius:13px;color:var(--ink);font:inherit;padding:11px 12px;outline:none}
.addrow input:focus{border-color:rgba(255,201,77,.7)}
.empty{color:var(--muted);text-align:center;padding:18px 14px;font-size:13.5px;line-height:1.5}
#toast{position:fixed;left:50%;top:calc(118px + var(--top));transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:var(--panel-solid);border:1px solid rgba(255,201,77,.65);font-weight:600;font-size:13.5px;z-index:9;box-shadow:0 10px 30px rgba(28,10,34,.45);white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;animation:toastIn .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-10px);opacity:0}}
#menu{position:fixed;right:var(--side);top:calc(66px + var(--top));padding:6px;display:grid;gap:1px;z-index:6;min-width:232px;max-width:calc(100vw - 20px);max-height:calc(100vh - 90px - var(--top));overflow-y:auto;animation:menuIn .18s ease-out;transform-origin:top right}
/* Right to left: the menu button sits on the left, so the menu opens under it. */
[dir="rtl"] #menu{right:auto;left:var(--side);transform-origin:top left}
@keyframes menuIn{from{transform:scale(.92);opacity:0}}
#menu button{display:flex;align-items:center;gap:11px;background:none;border:0;text-align:start;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:600}
#menu button svg{width:18px;height:18px;color:var(--muted);flex:none}
#menu button:active{background:var(--well-2)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
#searchBox{position:fixed;left:var(--side);right:var(--side);top:calc(10px + var(--top));padding:10px;z-index:7;display:grid;gap:8px;max-height:70%;animation:menuIn .18s ease-out;transform-origin:top center}
#searchBox input{background:var(--well);border:1px solid var(--line);border-radius:13px;color:var(--ink);font:inherit;padding:11px 12px;outline:none;font-size:15px}
#searchRes{overflow:auto;display:grid;gap:6px}
#feedback{position:fixed;left:var(--side);right:var(--side);bottom:calc(8px + var(--bot));padding:14px;border-radius:26px;display:grid;gap:10px;z-index:8;max-height:86%;overflow:auto;animation:sheetIn .3s cubic-bezier(.2,.9,.3,1)}
#fbText{background:var(--well);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:15px;padding:11px 12px;outline:none;resize:vertical;min-height:110px}
#fbDiag{font-size:10.5px;white-space:pre-wrap;line-height:1.5;max-height:90px;overflow:auto}
#renderer{position:fixed;right:12px;bottom:3px;font:500 9px var(--mono);color:rgba(255,240,225,.3);pointer-events:none}

/* R43 · goals board */
.gcard{margin-top:10px;border-radius:18px;background:linear-gradient(180deg,rgba(255,236,214,.10),rgba(255,236,214,.05));border:1px solid var(--line);padding:10px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.gtop{display:flex;gap:12px;align-items:center}
.gimg{width:120px;height:96px;border-radius:14px;overflow:hidden;flex:none;border:2px solid rgba(255,240,225,.22)}
.gimg svg,.gth svg{width:100%;height:100%;display:block}
.gtop b{display:block;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.gdue{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--gold);background:rgba(255,201,77,.13);border:1px solid rgba(255,201,77,.3);padding:3px 8px;border-radius:8px}
.gdue.soon,.gdue.late{color:#ffb3a8;background:rgba(255,122,107,.14);border-color:rgba(255,122,107,.35)}
.gstep{margin-top:10px;display:flex;align-items:center;gap:7px;border-radius:13px;background:rgba(95,212,196,.10);border:1px solid rgba(95,212,196,.3);padding:8px 9px}
.gmain{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.gmain small{display:block;color:#5fd4c4;font-size:11px;font-weight:800;margin-bottom:2px}
.gmain em{font-style:normal;color:var(--muted);font-size:12px}
.gmain input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;padding:3px 0;outline:none}
.gstep input[type=time]{width:92px;flex:none;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:13px;padding:6px;color-scheme:dark}
.gb1,.gb2{height:36px;padding:0 12px;border-radius:11px;font:inherit;font-size:13.5px;font-weight:800;white-space:nowrap;cursor:pointer;flex:none}
.gb1{background:transparent;border:1.5px solid #5fd4c4;color:#5fd4c4}
.gb2{background:linear-gradient(180deg,#ffc94d,#ff9f1c);border:0;color:var(--gold-ink)}
.gstarted{font-size:12px;font-weight:800;color:#5fd4c4;white-space:nowrap}
.gslot{margin-top:10px;padding:14px;border-radius:16px;border:2px dashed var(--line);color:var(--faint);font-size:13px;text-align:center}
.gwon{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gth{width:52px;height:42px;border-radius:10px;overflow:hidden;border:1.5px solid rgba(95,224,154,.55)}
/* R44 · the path, R45 · stuck questions */
.gstuck{display:block;width:100%;text-align:start;margin-top:10px;padding:9px 11px;border-radius:12px;background:rgba(170,150,255,.16);border:1px solid rgba(170,150,255,.45);color:#efe8ff;font-size:13px;font-weight:700}
.gmore{display:flex;align-items:center;gap:10px;margin-top:9px}
.gprog{font-size:12px;color:var(--muted);font-weight:700}
.gnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.chip.ghost{background:transparent}
.gstuckbox{border-radius:16px;padding:10px 12px 12px;background:rgba(170,150,255,.12);border:1px solid rgba(170,150,255,.4);display:flex;flex-direction:column;gap:8px}
.gstuckbox .q{font-weight:800;font-size:14px;margin-top:4px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchips .chip{white-space:normal;font-size:13px;padding:7px 11px}
.gstuckbox>.chip.ghost{align-self:flex-start}
.gpath{position:relative;display:flex;flex-direction:column;gap:12px;padding-inline-start:16px;margin-top:6px}
.gpath:before{content:"";position:absolute;inset-inline-start:4px;top:30px;bottom:24px;border-inline-start:3px dashed rgba(255,201,77,.55)}
.gst{position:relative;display:flex;align-items:center;gap:10px;padding:8px;border-radius:15px;background:var(--well);border:1px solid var(--line)}
.gst:before{content:"";position:absolute;inset-inline-start:-17px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.25)}
.gst.goal{border:2px solid var(--gold);box-shadow:0 0 18px rgba(255,201,77,.25)}
.gst.now{border-style:dashed}
.gst.now:before{background:var(--ink)}
.gst.done{opacity:.62}
.gsimg{width:72px;height:58px;border-radius:11px;overflow:hidden;flex:none;border:1.5px solid rgba(255,240,225,.22)}
.gsimg.big{width:96px;height:77px}
.gsimg svg{width:100%;height:100%;display:block}
.gstx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.gstx b{font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.gstx small{color:#5fd4c4;font-size:11px;font-weight:800}
.gstx em{font-style:normal;color:var(--muted);font-size:12px}
.gstx input[type=date]{align-self:flex-start;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;font-size:12px;padding:3px 6px;color-scheme:dark}
.gtick{width:36px;height:36px;border-radius:50%;border:2px solid var(--ok);background:transparent;color:var(--ok);font-weight:900;flex:none}
.grm{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--faint);font-size:18px;flex:none}
.gpin{position:absolute;top:-10px;inset-inline-end:10px;background:var(--ink);color:#1a1424;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.gflag{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.gflag svg{width:17px;height:17px}
.gplan{display:flex;flex-direction:column;gap:7px;margin-top:12px;padding:10px 12px 12px;border-radius:16px;background:var(--well);border:1px solid var(--line)}
.gplan label{font-weight:800;font-size:13.5px}
.gplan>input{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:11px;color:var(--ink);font:inherit;padding:9px 11px;outline:none}
.gplan>.chip{align-self:flex-start}
/* R51 · activity log, R52 · my week */
.pfbox{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:15px;background:var(--well);border:1px solid var(--line)}
.pfdays{display:flex;flex-wrap:wrap;gap:5px}
.pfdays .chip{min-width:38px;justify-content:center}
.pftimes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pftimes input{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:13.5px;padding:6px;color-scheme:dark}
.pfmeta{color:var(--muted);font-size:11.5px}
.pfrow{display:flex;align-items:center;gap:10px;font-size:13.5px}
.pfrow em{font-style:normal;color:var(--muted)}
.pfrow .grm{margin-inline-start:auto}
.pfnone{font-size:13px}
.pferr{flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px}
.pferr label{display:flex;align-items:center;gap:6px;font-size:14px}
.pferr input{width:18px;height:18px;accent-color:var(--gold)}
.jrow{display:grid;grid-template-columns:auto auto 1fr;gap:2px 10px;padding:8px 10px;border-radius:12px;background:var(--well);border:1px solid var(--line);font-size:13px;align-items:baseline}
.jrow time{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.jrow .jop{font-weight:800;font-size:12px;color:var(--gold)}
.jrow.remove .jop{color:var(--bad)} .jrow.add .jop{color:var(--ok)}
.jrow .jt{overflow-wrap:anywhere}
.jrow .jt em{font-style:normal;color:var(--muted);font-size:12px}
.jrow .jby{grid-column:1/-1;color:var(--faint);font-size:11px}
/* R53 · R54 · sync & devices */
.dvcard{display:flex;flex-direction:column;gap:9px;padding:12px 14px;border-radius:16px;background:var(--well);border:1px solid var(--line)}
.dvcard p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.dvcard b small{color:var(--muted);font-weight:600;font-size:12px}
.dvcard>.btn{align-self:flex-start}
.dvrow{flex-direction:row;align-items:center;justify-content:space-between}
.dvrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dvcode{font:700 22px/1.3 var(--mono);letter-spacing:.06em;text-align:center;padding:12px 8px;border-radius:12px;background:rgba(0,0,0,.3);border:1.5px dashed var(--gold);color:var(--gold);word-break:break-all}
.dvcode.small{font-size:20px;padding:6px}
.dvdev{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:var(--well);border:1px solid var(--line)}
.dvdev.off{opacity:.5}
.dvdev>div{flex:1;min-width:0}
.dvdev b{display:block;font-size:14px} .dvdev small{color:var(--muted);font-size:12px}
.dvic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--well-2);font-size:17px;flex:none}
.dvlost{margin-top:4px;font-size:13px;color:var(--muted)}
.dvlost summary{cursor:pointer;padding:6px 2px}
/* R60 · goals and tasks connected */
.gaff{display:inline-block;margin-top:5px;font:inherit;font-size:11.5px;font-weight:800;color:var(--muted);background:var(--well-2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;text-align:start}
.gaff.hard{color:#ffb3a8;background:rgba(255,92,77,.16);border-color:rgba(255,92,77,.5)}
.glinks{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.glink{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 7px;border-radius:10px;background:var(--well)}
.glink span{flex:1;min-width:0;overflow-wrap:anywhere} .glink em{font-style:normal;color:var(--muted);font-size:11.5px}
.glink.done span{text-decoration:line-through;opacity:.6}
.gtick.sm{width:26px;height:26px;font-size:13px;border-width:2px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:9px 10px;border-radius:12px;background:var(--well);border:1px solid var(--line);font:inherit;color:var(--ink)}
.lrow .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-weight:900;font-size:13px}
.lrow.on .ck{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.lrow .lt{flex:1;min-width:0} .lrow .lt b{display:block;font-size:13.5px;font-weight:600} .lrow .lt small{color:var(--muted);font-size:11.5px}
.lrow .why{font-size:10.5px;font-weight:800;color:#5fd4c4;background:rgba(95,212,196,.12);border-radius:6px;padding:2px 6px;white-space:nowrap;flex:none}
.lbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:10px 0 2px;background:linear-gradient(180deg,transparent,var(--panel-solid) 30%)}
.gmap{position:relative;display:grid;grid-template-columns:1fr 46px 1fr;align-items:start;padding-bottom:8px;touch-action:none}
.gmlines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.gmlines .gmhit{pointer-events:stroke;cursor:pointer}
.gmcol{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.gmcol.goals{position:sticky;top:0;align-self:start;z-index:2}
.gmcard{position:relative;border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.3;background:var(--well);border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
.gmcard.goal{border:1.5px solid var(--c);background:rgba(255,204,61,.08)}
.gmcard.goal.armed{box-shadow:0 0 0 3px var(--c)}
.gmcard.done{opacity:.55}
.gmcard b{display:block;font-weight:600;overflow-wrap:anywhere} .gmcard small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
.gmdot{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--c)}
[dir="rtl"] .gmcard.goal .gmdot{left:-9px} [dir="rtl"] .gmcard.task .gmdot{right:-9px}
html:not([dir="rtl"]) .gmcard.goal .gmdot{right:-9px} html:not([dir="rtl"]) .gmcard.task .gmdot{left:-9px}
/* R34 · today */
.pill.today{background:linear-gradient(180deg,#ffd76a,#ffb93a);color:var(--gold-ink);border-color:#ffe39a;font-weight:700}
.pill.today b{background:rgba(42,26,0,.18);border-radius:99px;padding:0 7px}
.pill.today.late b{background:var(--bad);color:#fff}
#today{cursor:pointer;background:none;border:0;padding:0}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -2px}
.sec.late{color:var(--bad)}
.bagline{width:100%;text-align:start;margin-top:4px}
.sec-ic{width:27px;height:27px;border-radius:9px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.sec-ic svg{width:16px;height:16px}
.chip.decorate{justify-self:start;background:rgba(255,201,77,.14);border-color:rgba(255,201,77,.45);color:var(--gold)}
.shopitem{align-items:center}
.catrow{align-items:center}
.catrow input{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);font:inherit;font-weight:600;font-size:14.5px;padding:2px 0;outline:none;width:100%}
.catrow input:focus{border-bottom-color:var(--gold)}
.shopitem .btn[disabled]{opacity:.45}
.item{transition:transform .18s ease-out,background .15s;touch-action:pan-y}
.item.swipe-done{background:rgba(95,224,154,.22)}
.item.swipe-edit{background:rgba(255,201,77,.18)}
/* R33 · edit */
#editor{position:fixed;left:var(--side);right:var(--side);bottom:calc(8px + var(--bot));padding:14px;border-radius:26px;z-index:8;max-height:88%;overflow:auto;animation:sheetIn .3s cubic-bezier(.2,.9,.3,1)}
#editorForm{display:grid;gap:11px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--well);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;outline:none;min-width:0;width:100%}
.fld select option{background:#2c1f3a}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:rgba(255,201,77,.7)}
.fld textarea{resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edstep{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.edstep i{width:16px;height:16px;border-radius:5px;border:2px solid var(--gold);flex:none}
.edstep i.on{background:var(--gold)}
.edstep input{flex:1}
.err{color:var(--bad);font-size:13px;margin:0;min-height:0}
.err:empty{display:none}
.btn.danger{color:var(--bad);border-color:rgba(255,122,107,.4)}
.item .t{background:none;border:0;padding:0;text-align:start;color:inherit;cursor:pointer}
.item .meta{cursor:pointer}
/* splash: the first thing you see while the city loads */
#splash{position:fixed;inset:0;z-index:40;display:grid;place-items:center;align-content:center;gap:10px;background:linear-gradient(180deg,#5d62a8 0%,#b17a9c 42%,#f0a383 70%,#ffd9a0 100%);transition:opacity .5s;text-align:center;padding:24px}
#splash.out{opacity:0;pointer-events:none}
#splash .sun{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6d8,#ffc94d 60%,#ff9f1c);box-shadow:0 0 0 14px rgba(255,214,120,.22),0 0 0 30px rgba(255,214,120,.12),0 0 80px rgba(255,190,90,.8);animation:breathe 2.2s ease-in-out infinite;margin-bottom:18px}
#splash b{font-size:26px;font-weight:800;text-shadow:0 2px 0 rgba(60,20,60,.25)}
#splash span{font-size:14px;font-weight:500;color:#fff1dc}
@keyframes breathe{50%{transform:scale(1.07)}}

/* R26 · celebrations */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.xpfly{position:fixed;z-index:31;pointer-events:none;display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:linear-gradient(180deg,#ffe08a,#ffb02e);color:var(--gold-ink);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--gold-edge),0 8px 22px rgba(255,170,40,.5);white-space:nowrap}
#banner{position:fixed;left:50%;top:calc(150px + var(--top));transform:translateX(-50%);z-index:28;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 14px;border-radius:18px;background:linear-gradient(180deg,#ffe08a,#ffb02e);color:var(--gold-ink);box-shadow:0 5px 0 var(--gold-edge),0 14px 34px rgba(255,170,40,.45);max-width:calc(100vw - 32px);animation:bannerIn .45s cubic-bezier(.2,1.5,.4,1)}
#banner b{display:block;font-size:17px;font-weight:800} #banner span{font-size:13px;font-weight:600;opacity:.8}
#banner.out{opacity:0;transition:opacity .3s}
@keyframes bannerIn{from{transform:translateX(-50%) translateY(-14px) scale(.8);opacity:0}}
#levelUp{position:fixed;inset:0;z-index:29;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(70,36,80,.6),rgba(24,12,34,.86));animation:luIn .3s ease-out}
#levelUp.out{opacity:0;transition:opacity .3s}
#levelUp .rays{position:absolute;left:50%;top:42%;width:160vmax;height:160vmax;margin:-80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,201,77,.2) 0 8deg,transparent 8deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 52%);mask-image:radial-gradient(circle,#000 0,transparent 52%);animation:spin 16s linear infinite}
.lu-card{position:relative;display:grid;justify-items:center;gap:6px;transform:translateY(-8vh);animation:luPop .6s cubic-bezier(.2,1.5,.4,1)}
.lu-badge{width:112px;height:112px;border-radius:36px;background:linear-gradient(160deg,#ffe08a,#ff9f1c);display:grid;place-items:center;color:var(--gold-ink);font-weight:800;font-size:54px;box-shadow:0 7px 0 var(--gold-edge),0 0 64px rgba(255,190,80,.75);border:3px solid #fff3cf}
.lu-card b{font-size:30px;font-weight:800;margin-top:12px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.lu-card span{color:#ffe7c2;font-weight:600;font-size:15px}
@keyframes luIn{from{opacity:0}} @keyframes luPop{from{transform:translateY(-8vh) scale(.4);opacity:0}} @keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="scrim"></div>
<div id="labels"></div>
<div id="fade"></div>

<div id="hud">
  <div id="hudMain" class="panel">
    <div id="lvl" aria-label="Level">1</div>
    <div class="hud-mid">
      <div class="hud-top"><b id="lvlName">Level 1</b><button id="today" aria-label="Open Today" data-i18n-aria="openToday"></button></div>
      <div class="hud-bars">
        <div class="stat xp" title="Experience"><svg viewBox="0 0 24 24" fill="#ffc94d" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.6 1.6 7L12 17.6 5.7 21.2l1.6-7L2 9.6 9 9z"/></svg><div class="bar"><i id="xpBar" style="width:0;background:linear-gradient(90deg,#ffd76a,#ff9f1c)"></i></div><span id="xpTxt">0/100</span></div>
        <div class="stat coin" title="Coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffc94d"/><circle cx="12" cy="12" r="6" fill="none" stroke="#c88a12" stroke-width="2"/></svg><span id="coinTxt">0</span></div>
        <div class="stat hp" title="Health"><svg viewBox="0 0 24 24" fill="#5fe09a" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><div class="bar"><i id="hpBar" style="width:0;background:linear-gradient(90deg,#8ff0b8,#34c476)"></i></div><span id="hpTxt">70</span></div>
      </div>
    </div>
    <button class="hudbtn" id="goalsBtn" aria-label="Open the goals board" data-i18n-aria="s_goals"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h12l-2.500 4L17 12H5"/></svg></button>
    <button class="hudbtn" id="searchBtn" aria-label="Search" data-i18n-aria="s_search"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></button>
    <button class="hudbtn" id="menuBtn" aria-label="Menu" data-i18n-aria="s_menu"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div id="quests"></div>
  <button id="back" class="pill" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg> <span data-i18n="cityHome">City · </span><b>Home</b></button>
</div>

<div id="hint" class="pill" hidden data-i18n="s_hint">Tap a building to open it. Drag to move, twist to turn.</div>
<div id="viewCtl">
  <button class="hudbtn float" id="walkBtn" aria-label="Walk in the city" data-i18n-aria="s_walk" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.500" r="1.800"/><path d="M9.500 21l2-5.500-2.500-2.500 1.500-5 3.500 1.500 2.500 3.500M10.500 8L7 10v3.500M14.500 21l-.5-4.500"/></svg></button>
  <button class="hudbtn float" id="rotL" aria-label="Turn the view left" data-i18n-aria="s_turnL"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.600-5.900M4 4v4.500h4.500"/></svg></button>
  <button class="hudbtn float" id="rotR" aria-label="Turn the view right" data-i18n-aria="s_turnR"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.600-5.900M20 4v4.500h-4.500"/></svg></button>
</div>
<div id="dock">
  <button id="bagBtn" aria-label="Open the bag" data-i18n-aria="s_openBag"><svg id="bagArt" viewBox="0 0 64 64" width="50" height="50" aria-hidden="true">
      <defs>
        <linearGradient id="bgLeather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8743c"/><stop offset=".55" stop-color="#a5552a"/><stop offset="1" stop-color="#7c3c1d"/></linearGradient>
        <linearGradient id="bgFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e08c4c"/><stop offset="1" stop-color="#b4602f"/></linearGradient>
        <linearGradient id="bgBrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#ffc94d"/><stop offset="1" stop-color="#c88a12"/></linearGradient>
      </defs>
      <path d="M19 22c0-9 5.500-14 13-14s13 5 13 14" fill="none" stroke="#6b3216" stroke-width="5" stroke-linecap="round"/>
      <path d="M19 22c0-9 5.500-14 13-14s13 5 13 14" fill="none" stroke="#c8743c" stroke-width="2.200" stroke-linecap="round"/>
      <rect x="9" y="20" width="46" height="36" rx="10" fill="url(#bgLeather)"/>
      <rect x="9" y="20" width="46" height="36" rx="10" fill="none" stroke="#5e2a12" stroke-width="1.600"/>
      <path d="M14 51.500h36" stroke="#f3c08e" stroke-width="1.200" stroke-dasharray="2.400 2.200" opacity=".7"/>
      <rect x="6" y="34" width="6" height="14" rx="2.500" fill="#8e4520"/><rect x="52" y="34" width="6" height="14" rx="2.500" fill="#8e4520"/>
      <path d="M9 23c0-2.800 2.200-5 5-5h36c2.800 0 5 2.200 5 5v9c0 3-2 5-5 5.500l-15 2.500h-6l-15-2.500C11 37 9 35 9 32z" fill="url(#bgFlap)" stroke="#5e2a12" stroke-width="1.600"/>
      <path d="M13 24h38" stroke="#fff1dc" stroke-width="1.200" stroke-dasharray="2.400 2.200" opacity=".55"/>
      <path d="M14 21.500c4-1 9-1.500 14-1.500" stroke="#ffd9b0" stroke-width="2" stroke-linecap="round" opacity=".55"/>
      <rect x="26.500" y="35" width="11" height="12" rx="3" fill="url(#bgBrass)" stroke="#8a5a08" stroke-width="1.400"/>
      <rect x="30" y="38.500" width="4" height="5" rx="1.300" fill="#7c3c1d"/>
    </svg><span id="bagCount" hidden>0</span></button>
  <div id="capture" class="panel">
    <form id="capForm" autocomplete="off">
      <input id="capInput" enterkeyhint="send" placeholder="Drop anything into your bag…" aria-label="Capture" data-i18n-ph="s_capturePh" data-i18n-aria="s_capture">
      <button type="button" class="capbtn" id="micBtn" aria-label="Speak" data-i18n-aria="s_speak"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button type="button" class="capbtn" id="camBtn" aria-label="Photo" data-i18n-aria="s_photo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button type="button" class="capbtn" id="scanBtn" aria-label="Scan a document" data-i18n-aria="s_scan" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></button>
    </form>
    <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
  </div>
</div>

<div id="sheet" class="panel" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div id="sheetHead"><span id="sheetDot"></span><div style="flex:1;min-width:0"><h2 id="sheetTitle"></h2><div id="sheetSub" class="muted"></div></div><button class="x" id="sheetClose" aria-label="Close" data-i18n-aria="s_close">✕</button></div>
  <div id="sheetTabs" hidden></div>
  <div id="sheetBody"></div>
</div>

<div id="menu" class="panel" hidden>
  <button data-act="feedback"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-i18n="m_feedback">Send feedback…</span></button>
  <button data-act="share"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg><span data-i18n="m_share">Share a summary…</span></button>
  <button data-act="sound"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10zM16.5 9a4 4 0 0 1 0 6"/></svg><span>Sound: on</span></button>
  <hr>
  <button data-act="autobackup" id="autoBackupItem" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-8 6 6 0 0 1 11.4 1.600A3.500 3.500 0 0 1 17 18zM12 11v6M9.500 14.500L12 17l2.500-2.500"/></svg><span data-i18n="m_autobackup">Daily backup to a folder…</span></button>
  <button data-act="export"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg><span data-i18n="m_export">Export backup (JSON)</span></button>
  <button data-act="exportmd"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/></svg><span data-i18n="m_exportmd">Export notes (Markdown)</span></button>
  <button data-act="import"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 19h14"/></svg><span data-i18n="m_import">Import backup…</span></button>
  <hr>
  <button data-act="examples"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span data-i18n="m_examples">Remove example items</span></button>
  <button data-act="categories"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z"/></svg><span data-i18n="m_categories">Categories…</span></button>
  <button data-act="quality" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 4 3-3 6 5M3 5h18v14H3z"/></svg><span>Graphics</span></button>
  <button data-act="devices"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="11" height="8" rx="1.5"/><rect x="15" y="8" width="6" height="12" rx="1.5"/><path d="M6 16h6M9 12v4"/></svg><span data-i18n="m_devices">Sync & devices…</span></button>
  <button data-act="profile"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M8 14h3M8 17h6"/></svg><span data-i18n="m_profile">My week & memory…</span></button>
  <button data-act="journal"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg><span data-i18n="m_journal">Activity log…</span></button>
  <button data-act="theme"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18z" fill="currentColor"/><circle cx="12" cy="12" r="9"/></svg><span>Colours</span></button>
  <button data-act="lang"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18zM3.600 9h16.800M3.600 15h16.800M12 3c2.500 2.500 3.600 5.500 3.600 9s-1.100 6.500-3.600 9c-2.500-2.500-3.600-5.500-3.600-9S9.500 5.500 12 3z"/></svg><span>Language: English</span></button>
  <button data-act="about"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v6M12 7.500v.01M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18z"/></svg><span data-i18n="m_about">About this version</span></button>
</div>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<div id="searchBox" class="panel" hidden>
  <div class="row"><input id="searchInput" placeholder="Search items, people, tasks…" style="flex:1" aria-label="Search" data-i18n-ph="s_searchPh" data-i18n-aria="s_search"><button class="x" id="searchClose" aria-label="Close search" data-i18n-aria="s_closeSearch">✕</button></div>
  <div id="searchRes"></div>
</div>

<div id="feedback" class="panel" hidden role="dialog" aria-label="Send feedback">
  <div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:19px" data-i18n="f_title">Send feedback</h2><button class="x" id="fbClose" aria-label="Close" data-i18n-aria="s_close">✕</button></div>
  <div class="row" id="fbKinds" style="gap:6px;flex-wrap:wrap">
    <button class="chip on" data-kind="idea" data-i18n="f_idea">Idea</button>
    <button class="chip" data-kind="bug" data-i18n="f_bug">Something's wrong</button>
    <button class="chip" data-kind="praise" data-i18n="f_praise">I like…</button>
  </div>
  <textarea id="fbText" rows="5" placeholder="What happened, or what would make this better?" aria-label="Your feedback" data-i18n-ph="f_ph"></textarea>
  <label class="row muted" style="font-size:13px;gap:8px"><input type="checkbox" id="fbDetails" checked> <span data-i18n="f_details">Include version and device details</span></label>
  <div id="fbDiag" class="mono muted"></div>
  <div class="row" style="gap:8px"><button class="btn primary" id="fbGitHub" style="flex:1.3" data-i18n="f_github">Open on GitHub</button><button class="btn" id="fbShare" style="flex:1" data-i18n="f_share">Share…</button></div>
  <p class="muted" style="font-size:12px;margin:0;line-height:1.45" data-i18n="f_help">GitHub opens a new issue with this filled in: sign in and press Submit. Or share it by email or chat.</p>
</div>
<div id="editor" class="panel" hidden role="dialog" aria-label="Edit">
  <form id="editorForm" autocomplete="off">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:19px" data-i18n="e_title">Edit</h2><button type="button" class="x" id="edClose" aria-label="Close" data-i18n-aria="s_close">✕</button></div>
    <label class="fld"><span data-i18n="e_name">Name</span><input id="edTitle" maxlength="200"></label>
    <div class="fgrid">
      <label class="fld"><span data-i18n="e_kind">Kind</span><select id="edType"><option value="task" data-i18n="k_task">Task</option><option value="note" data-i18n="k_note">Note</option><option value="item" data-i18n="k_item">Thing</option><option value="link" data-i18n="k_link">Link</option><option value="person" data-i18n="k_person">Person</option><option value="pet" data-i18n="k_pet">Pet</option><option value="document" data-i18n="k_document">Document</option><option value="photo" data-i18n="k_photo">Photo</option></select></label>
      <label class="fld"><span data-i18n="e_place">Place</span><select id="edPlace"></select></label>
    </div>
    <div class="fld" id="edDueRow"><span data-i18n="e_due">Due</span><div class="row" style="gap:6px;flex-wrap:wrap"><input id="edDue" type="date" style="flex:1;min-width:140px"><span id="edDueChips" class="row" style="gap:5px;flex-wrap:wrap"><button type="button" class="chip" data-days="0" data-i18n="today">Today</button><button type="button" class="chip" data-days="1" data-i18n="e_tomorrow">Tomorrow</button><button type="button" class="chip" data-days="7" data-i18n="e_nextWeek">Next week</button><button type="button" class="chip" data-days="" data-i18n="e_none">None</button></span></div></div>
    <div class="fld" id="edTimeRow"><span data-i18n="e_time">Time</span><div class="row" style="gap:6px;flex-wrap:wrap"><input id="edTime" type="time" style="width:120px"><select id="edRemind" style="flex:1;min-width:150px" aria-label="Remind me" data-i18n-aria="e_remind"><option value="notify" data-i18n="rm_notify">Notification with sound</option><option value="alarm" data-i18n="rm_alarm">Alarm (rings until stopped)</option><option value="none" data-i18n="rm_none">No reminder</option></select></div><small class="muted" id="edAlarmHelp" data-i18n="rm_alarmHelp" hidden style="font-size:11.5px"></small></div>
    <label class="fld" id="edRepeatRow"><span data-i18n="e_repeats">Repeats</span><select id="edRepeat"><option value="" data-i18n="e_never">Never</option><option value="1:day" data-i18n="r_day">Every day</option><option value="1:week" data-i18n="r_week">Every week</option><option value="2:week" data-i18n="r_2week">Every 2 weeks</option><option value="1:month" data-i18n="r_month">Every month</option><option value="3:month" data-i18n="r_3month">Every 3 months</option><option value="6:month" data-i18n="r_6month">Every 6 months</option><option value="1:year" data-i18n="r_year">Every year</option></select></label>
    <div class="fld" id="edEffortRow"><span data-i18n="e_effort">Effort</span><div id="edEffort" class="row" style="gap:5px" data-v="1"><button type="button" class="chip" data-v="1">1</button><button type="button" class="chip" data-v="2">2</button><button type="button" class="chip" data-v="3">3</button><button type="button" class="chip" data-v="4">4</button><button type="button" class="chip" data-v="5">5</button></div></div>
    <div class="fld" id="edStepsRow"><span data-i18n="e_steps">Steps</span><div id="edSteps"></div><button type="button" class="chip" id="edAddStep" style="justify-self:start" data-i18n="e_addStep">+ Add a step</button></div>
    <label class="fld" id="edUrlRow"><span data-i18n="e_link">Link</span><input id="edUrl" type="url" inputmode="url" placeholder="https://"></label>
    <label class="fld"><span data-i18n="e_notes">Notes</span><textarea id="edNotes" rows="3"></textarea></label>
    <p id="edError" class="err" role="alert"></p>
    <div class="row" style="gap:8px"><button type="button" class="btn danger" id="edDelete" data-i18n="e_delete">Delete</button><span style="flex:1"></span><button type="button" class="btn" id="edCancel" data-i18n="e_cancel">Cancel</button><button class="btn primary" id="edSave" data-i18n="e_save">Save</button></div>
  </form>
</div>
<div id="toast" hidden></div>
<div id="renderer"></div>
<div id="splash"><div class="sun"></div><b>Life Archipelago</b><span id="splashMsg" data-i18n="splash">Lighting up your city…</span></div>
<script type="module" src="./app.js"></script>
</body>
</html>
