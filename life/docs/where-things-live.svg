<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Arial, 'Liberation Sans', sans-serif">
  <title>Where everything lives · Life Archipelago</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a5cc7"/></marker>
  </defs>
  <rect width="900" height="600" fill="#fbfaf7"/>
  <text x="450" y="34" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="#17141f">איפה נמצא כל דבר</text>

  <!-- application -->
  <rect x="300" y="60" width="300" height="150" rx="16" fill="#e8f0ff" stroke="#3f5bd8" stroke-width="2.5"/>
  <text x="450" y="90" text-anchor="middle" direction="rtl" font-size="18" font-weight="700" fill="#17141f">האפליקציה</text>
  <text x="450" y="114" text-anchor="middle" direction="rtl" font-size="14" fill="#333">טלפון (APK) · מחשב (דפדפן)</text>
  <text x="450" y="140" text-anchor="middle" direction="rtl" font-size="14" fill="#333">כאן הקוד רץ, וכאן הנתונים פתוחים</text>
  <text x="450" y="164" text-anchor="middle" direction="rtl" font-size="14" fill="#333">מפתחות ההצפנה: רק כאן</text>
  <text x="450" y="190" text-anchor="middle" direction="rtl" font-size="13" fill="#127a3e" font-weight="700">🔑 פותח הכל</text>

  <!-- GitHub -->
  <rect x="30" y="250" width="250" height="170" rx="16" fill="#f1f1f1" stroke="#333" stroke-width="2"/>
  <text x="155" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#17141f">GitHub</text>
  <text x="155" y="306" text-anchor="middle" direction="rtl" font-size="14" fill="#333">קוד המקור ומסמכים</text>
  <text x="155" y="330" text-anchor="middle" direction="rtl" font-size="14" fill="#333">Pages: קבצי האתר</text>
  <text x="155" y="354" text-anchor="middle" direction="rtl" font-size="14" fill="#333">Actions + Releases: ה-APK</text>
  <text x="155" y="378" text-anchor="middle" direction="rtl" font-size="14" fill="#333">מבנה הטבלאות (SQL)</text>
  <text x="155" y="404" text-anchor="middle" direction="rtl" font-size="13" fill="#9a5b00" font-weight="700">אין נתונים אישיים · ציבורי</text>

  <!-- Supabase -->
  <rect x="620" y="250" width="250" height="170" rx="16" fill="#e7f7ee" stroke="#127a3e" stroke-width="2.5"/>
  <text x="745" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#17141f">Supabase</text>
  <text x="745" y="306" text-anchor="middle" direction="rtl" font-size="14" fill="#333">רשומות, יומן וקלט גולמי</text>
  <text x="745" y="330" text-anchor="middle" direction="rtl" font-size="14" fill="#333">מכשירים ובקשות צימוד</text>
  <text x="745" y="354" text-anchor="middle" direction="rtl" font-size="14" fill="#333">גלוי: מזהים, זמנים, מכשיר</text>
  <text x="745" y="378" text-anchor="middle" direction="rtl" font-size="14" fill="#333">פרנקפורט (eu-central-1)</text>
  <text x="745" y="404" text-anchor="middle" direction="rtl" font-size="13" fill="#127a3e" font-weight="700">🔒 רק תוכן נעול</text>

  <!-- Claude -->
  <rect x="300" y="440" width="300" height="130" rx="16" fill="#f1ecff" stroke="#7a5cc7" stroke-width="2.5"/>
  <text x="450" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#17141f">Claude</text>
  <text x="450" y="494" text-anchor="middle" direction="rtl" font-size="14" fill="#333">כותב קוד ודוחף ל-GitHub</text>
  <text x="450" y="518" text-anchor="middle" direction="rtl" font-size="14" fill="#333">מנהל את מבנה הטבלאות (מפתח sbp_)</text>
  <text x="450" y="544" text-anchor="middle" direction="rtl" font-size="13" fill="#7a5cc7" font-weight="700">קורא נתונים רק אם אישרת · 24 שעות</text>

  <!-- Vercel: not used -->
  <rect x="680" y="470" width="190" height="100" rx="16" fill="none" stroke="#9b97a3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="775" y="505" text-anchor="middle" font-size="17" font-weight="700" fill="#9b97a3">Vercel</text>
  <text x="775" y="530" text-anchor="middle" direction="rtl" font-size="14" fill="#9b97a3">לא בשימוש</text>
  <text x="775" y="552" text-anchor="middle" direction="rtl" font-size="14" fill="#9b97a3">אין שם כלום</text>

  <!-- arrows -->
  <path d="M230 250 L330 212" stroke="#333" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="235" y="222" direction="rtl" text-anchor="middle" font-size="12.5" fill="#333">קבצים ו-APK</text>
  <path d="M570 212 L670 250" stroke="#333" stroke-width="2.2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="675" y="222" direction="rtl" text-anchor="middle" font-size="12.5" fill="#333">סנכרון מוצפן</text>
  <path d="M330 470 L230 422" stroke="#7a5cc7" stroke-width="2.2" fill="none" marker-end="url(#d)"/>
  <text x="250" y="470" direction="rtl" text-anchor="middle" font-size="12.5" fill="#7a5cc7">קוד</text>
  <path d="M570 470 L670 422" stroke="#7a5cc7" stroke-width="2.2" fill="none" stroke-dasharray="6 5" marker-end="url(#d)"/>
  <text x="640" y="470" direction="rtl" text-anchor="middle" font-size="12.5" fill="#7a5cc7">מבנה טבלאות</text>
</svg>
